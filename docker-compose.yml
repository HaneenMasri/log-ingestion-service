services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: logs
      POSTGRES_USER: logs
      POSTGRES_PASSWORD: logs
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=64MB", "-c", "max_connections=30"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logs -d logs"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      PORT: 8080
      DATABASE_URL: postgres://logs:logs@postgres:5432/logs
      AUTH_ENABLED: "false"
      RETENTION_DAYS: 31
      RETENTION_INTERVAL_MS: 60000
      MAX_BATCH_SIZE: 2000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
