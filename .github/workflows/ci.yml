name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: logs
          POSTGRES_USER: logs
          POSTGRES_PASSWORD: logs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U logs -d logs"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://logs:logs@localhost:5432/logs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run migrate
